name: aeris_flutter
description: Unified Bridge Client Core and Flutter Adapter with a thin iOS and Android plugins.
version: 0.26.0-preview.1
publish_to: none
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.aeris.sdk.flutter
        pluginClass: AerisUnifiedBridgePlugin
      ios:
        pluginClass: AerisUnifiedBridgePlugin
