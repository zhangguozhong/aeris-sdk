name: aeris_flutter
description: Aeris Flutter 通信插件，提供 Dart Client Core 和 iOS/Android 原生宿主适配。
version: 0.26.0-preview.3
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.aeris.sdk.flutter
        pluginClass: AerisUnifiedBridgePlugin
      ios:
        pluginClass: AerisUnifiedBridgePlugin

repository: https://github.com/zhangguozhong/aeris-sdk/tree/flutter-0.26.0-preview.3/packages/flutter
