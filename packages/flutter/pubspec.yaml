name: aeris_flutter
description: Unified Bridge Client Core and Flutter Adapter with a thin iOS and Android plugins.
version: 0.26.0-preview.2
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.aeris.sdk.flutter
        pluginClass: AerisUnifiedBridgePlugin
      ios:
        pluginClass: AerisUnifiedBridgePlugin

repository: https://github.com/zhangguozhong/aeris-sdk/tree/flutter-0.26.0-preview.2/packages/flutter
